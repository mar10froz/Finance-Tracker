<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Finances</title>
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Personal pay-period budget tracker">
<link rel="manifest" href="manifest.webmanifest?v=102">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:Manrope;font-style:normal;font-weight:400;font-display:swap;src:url(manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-style:normal;font-weight:500;font-display:swap;src:url(manrope-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-style:normal;font-weight:600;font-display:swap;src:url(manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-style:normal;font-weight:700;font-display:swap;src:url(manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-style:normal;font-weight:800;font-display:swap;src:url(manrope-latin-800-normal.woff2) format('woff2')}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1c1c1a;--mute:#706d65;--line:#e6e2d8;--track:#ece8de;
  --accent:#1f8a5b;--accent-soft:#e3f2e9;--save:#c99a1e;--warn:#d4851a;--bad:#d2493b;--bill:#3c6fd8;--in:#1f8a5b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111210;--card:#1a1b19;--ink:#efede7;--mute:#9b988f;--line:#2b2c29;--track:#2a2b28;
  --accent:#3cbf83;--accent-soft:#18291f;--save:#e2b53c;--warn:#eaa33c;--bad:#f06b5c;--bill:#7aa2ff;--in:#3cbf83;--shadow:none;
}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:92px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:14px 14px 0}
header.top{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 4px 14px;gap:12px}
header.top h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.02em}
header.top .sub{font-size:12px;color:var(--mute);text-align:right}
.banner{background:#fff4d6;color:#5b4300;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.banner{background:#3a2f12;color:#f5dd9c}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 10px;font-weight:800}
.muted{color:var(--mute)}
.small{font-size:12px}
.hero .k{font-size:13px;color:var(--mute);font-weight:600}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:6px 0 4px}
.hero .big.bad{color:var(--bad)}
.hero .perday{font-size:14px;color:var(--mute)}
.hero .perday b{color:var(--ink)}
.barwrap{position:relative}
.track{height:14px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.track.thin{height:10px}
.seg{height:100%;flex:none;transition:width .35s ease}
.striped{background:repeating-linear-gradient(45deg,var(--bill) 0 3px,transparent 3px 7px);opacity:.75}
.pace{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.5;border-radius:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:7px;justify-content:space-between}
.legend span.l{display:flex;align-items:center;gap:7px;color:var(--mute)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.avail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute)}
.bar{margin:16px 0 4px}
.bar:first-of-type{margin-top:4px}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:7px;gap:8px}
.bar .name{font-weight:700;display:flex;align-items:center;gap:8px}
.bar .val{color:var(--mute);font-size:13px}
.bar .val b{color:var(--ink)}
.bar .note{font-size:12px;color:var(--mute);margin-top:5px}
.bar .note.bad{color:var(--bad);font-weight:600}
.bar .note.warn{color:var(--warn);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.seg-toggle{display:inline-flex;background:var(--track);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
.seg-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mute)}
.seg-toggle button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount-wrap{display:flex;align-items:center;background:var(--track);border-radius:14px;padding:0 14px}
.amount-wrap .cur{font-size:26px;font-weight:700;color:var(--mute)}
.amount-in{font-size:28px;font-weight:800;border:none;background:transparent;padding:12px 8px;width:100%;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 13px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:700}
.field input:not([type=checkbox]),.field select,.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:12px 0}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;background:var(--ink);color:var(--card);margin-top:12px}
.btn.alt{background:var(--track);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.list{margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:none}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--mute);margin-top:2px}
.item .amt{font-weight:800;font-size:15px;white-space:nowrap}
.amt.in{color:var(--in)}
.amt.bill{color:var(--bill)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.sub{background:color-mix(in srgb,var(--bill) 14%,transparent);color:var(--bill)}
.presets{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin:4px 0 2px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets .chip{flex:none;padding:6px 11px;font-size:13px}
.ctot{font-size:13px;color:var(--mute);font-weight:600;text-transform:none;letter-spacing:0}
.badge{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:28%;color:#fff;font-weight:800;letter-spacing:-.02em;flex:none;overflow:visible;line-height:1}
.badge img{width:100%;height:100%;object-fit:cover;border-radius:28%;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.badge .cc{position:absolute;right:-3px;bottom:-3px;border-radius:2px;background:linear-gradient(180deg,#fff 0 30%,#2b2b2b 30% 48%,#fff 48%);border:1px solid var(--line)}
.chip .badge{margin-left:-5px}
.chip.on .badge img{box-shadow:none}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.sw-btn.on{box-shadow:0 0 0 2px var(--ink)}
.colorin{width:28px;height:28px;border:none;padding:0;background:none;border-radius:50%;overflow:hidden}
.acctrow3{display:flex;gap:10px;align-items:center;margin:-4px 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.acctrow3 .lg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.tag.card{background:color-mix(in srgb,#c0397a 14%,transparent);color:#c0397a}
.acctline{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.acctline>span{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap}
.chips.sm{margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.sm .chip{padding:6px 11px;font-size:13px;flex:none}
.row2.tr{grid-template-columns:1fr 1fr}
.row2.tr .field{margin:0 0 10px}
.acctrow{display:grid;grid-template-columns:1fr 136px 38px;gap:8px;align-items:center;margin:10px 0 4px}
.acctrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.acctrow .x{height:44px;border:1px solid var(--line);background:transparent;border-radius:12px;color:var(--mute);font-size:18px}
.payrow{display:grid;grid-template-columns:130px 1fr 38px;gap:8px;align-items:center;margin:8px 0}
#w-days .payrow{grid-template-columns:130px 1fr}
.payrow.payhead{font-size:12px;color:var(--mute);font-weight:700;margin-bottom:-2px}
.payrow .x{height:44px;border:1px solid var(--line);background:transparent;border-radius:12px;color:var(--mute);font-size:18px}
.radio{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0}
.radio input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.cardh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.cardh h2{margin:0}
.linkbtn{background:none;border:none;color:var(--mute);font-weight:700;font-size:13px;padding:8px 0}
.empty{font-size:14px;color:var(--mute);padding:6px 0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{margin:0;font-size:17px;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--mute);text-align:center;padding:2px 0 4px;font-weight:800}
.cell{min-height:58px;border-radius:11px;background:transparent;border:1.5px solid transparent;padding:5px 4px 4px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;overflow:hidden}
.cell.inper{background:var(--accent-soft)}
.cell.today{border-color:var(--ink)}
.cell .dn{font-size:13px;font-weight:800;line-height:18px;padding:0 4px;border-radius:6px}
.cell.pay .dn{background:var(--in);color:#fff}
.cell.past .dn{opacity:.55}
.cell .dots{display:flex;gap:3px;margin-top:auto;padding-left:3px;min-height:6px}
.cell .dots i{width:6px;height:6px;border-radius:50%;display:block}
.cell .camt{font-size:10.5px;font-weight:800;color:var(--bad);padding-left:3px;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}
.cal-legend span{display:flex;align-items:center;gap:6px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sumgrid .v{font-weight:800;font-size:16px}
.sumgrid .l{font-size:11.5px;color:var(--mute);margin-top:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:none;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute)}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:22px;height:22px}
#sheet{position:fixed;inset:0;display:none;z-index:50}
#sheet.open{display:block}
#sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.sheet-h h3{margin:0;font-size:20px;letter-spacing:-.02em}
.sheet-h .k{font-size:12px;color:var(--mute);font-weight:700}
.balline{background:var(--track);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0 12px}
.subh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800;margin:16px 0 4px}
.mini{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--mute)}
.catrow{display:grid;grid-template-columns:1fr 120px 38px;gap:8px;align-items:center;margin:8px 0}
.catrow.cc4{grid-template-columns:30px 1fr 110px 38px}
.catrow .x{height:44px;border:1px solid var(--line);background:transparent;border-radius:12px;color:var(--mute);font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.welcome h2{font-size:22px;text-transform:none;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
.loading{text-align:center;color:var(--mute);padding:40px 16px}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1>My Finances</h1><div class="sub" id="hdr-sub"></div></header>
  <div id="banner" class="banner" hidden></div>
  <main>
    <section id="view-home"></section>
    <section id="view-cal" hidden></section>
    <section id="view-plans" hidden></section>
    <section id="view-setup" hidden></section>
  </main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7"/></svg>Budget</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Planned</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setup</button>
</div></nav>
<div id="sheet"><div class="backdrop" data-act="close"></div><div class="panel" id="sheet-body"></div></div>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const r2=n=>Math.round(n*100)/100;
const parseAmt=s=>{const v=parseFloat(String(s).replace(/[^0-9.]/g,''));return isFinite(v)?r2(v):0};
const cur=()=>(S.settings&&S.settings.currency)||'₱';
function money(n){n=r2(n);const v=Math.abs(n);return (n<0?'−':'')+cur()+v.toLocaleString('en-PH',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}
function compact(n){const v=Math.abs(n);let s;if(v>=1e6)s=(v/1e6).toFixed(1)+'M';else if(v>=1e4)s=Math.round(v/1e3)+'k';else if(v>=1e3)s=(v/1e3).toFixed(1)+'k';else s=String(Math.round(v));return s.replace('.0','')}
const fmtShort=d=>pd(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtLong=d=>pd(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dayWord=n=>n===0?'today':n===1?'tomorrow':`in ${n} days`;
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);

/* ---------- state ---------- */
const S={settings:null,plans:{items:[]},months:{},logos:{},ready:false};
let view='home',calY=new Date().getFullYear(),calM=new Date().getMonth();
let draft={amount:'',cat:null,note:'',date:'',kind:'out',acct:null,from:null,to:null};
let sheetCtx=null,needRender=false,showAllTx=false,catDraft=null;
const PALETTE=['#1f8a5b','#3c6fd8','#c2662d','#8a5bd1','#c0397a','#2a9bb0','#8b8b3a','#7a7a7a'];
const DEFAULT_CATS=[{id:'food',name:'Food'},{id:'transport',name:'Transport'},{id:'shopping',name:'Shopping'},{id:'fun',name:'Fun'},{id:'other',name:'Other'}];
const PRESETS={
  sub:['Netflix','Spotify','YouTube Premium','Disney+','iCloud+','Google One','Gym','Game Pass'],
  bill:['Rent','Meralco','Maynilad','Internet','Postpaid plan','Credit card','Loan','Insurance']
};
const outType=it=>it.type==='sub'?'sub':'bill';
function monthlyEq(it){const a=+it.amount||0;switch(it.repeat){case 'weekly':return a*52/12;case 'biweekly':return a*26/12;case 'monthly':return a;case 'yearly':return a/12;default:return 0}}
const cats=()=>(S.settings&&S.settings.categories)||[];
const catColor=id=>{const i=cats().findIndex(c=>c.id===id);if(i>=0&&cats()[i].color)return cats()[i].color;return PALETTE[(i<0?7:i)%PALETTE.length]};

/* ---------- money logic ---------- */
function occ(it,a,b){
  const out=[],start=it.date;if(!start)return out;
  const lo=a>start?a:start;let hi=b;if(it.until&&it.until<hi)hi=it.until;if(lo>hi)return out;
  const skip=new Set(it.skips||[]);const push=s=>{if(s>=lo&&s<=hi&&!skip.has(s))out.push(s)};
  const r=it.repeat||'none';
  if(r==='none')push(start);
  else if(r==='weekly'||r==='biweekly'){const step=r==='weekly'?7:14;let k=Math.max(0,Math.ceil(diffDays(start,lo)/step));let s=addDays(start,k*step);while(s<=hi){push(s);k++;s=addDays(start,k*step)}}
  else if(r==='monthly'){const day=it.dom||pd(start).getDate();const l=pd(lo);let y=l.getFullYear(),m=l.getMonth();for(let g=0;g<600;g++){const s=ds(new Date(y,m,Math.min(day,dim(y,m))));if(s>hi)break;push(s);m++;if(m>11){m=0;y++}}}
  else if(r==='yearly'){const sd=pd(start);let y=pd(lo).getFullYear();for(let g=0;g<100;g++){const mm=sd.getMonth();const s=ds(new Date(y,mm,Math.min(sd.getDate(),dim(y,mm))));if(s>hi)break;push(s);y++}}
  return out;
}
function plannedAll(a,b){const out=[];for(const it of items())for(const d of occ(it,a,b))out.push({date:d,it,kind:it.kind,amount:+it.amount||0});return out.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0)}
function txAll(a,b){const out=[];for(const k in S.months){if(k<a.slice(0,7)||k>b.slice(0,7))continue;for(const t of (S.months[k].tx||[]))if(t.date>=a&&t.date<=b)out.push(t)}return out}
/* counted versions: transactions from the start date, planned items from the day after (start balance already includes that day's planned items) */
function plannedCounted(a,b){const s0=S.settings.startDate;const lo=addDays(s0,1);return plannedAll(a>lo?a:lo,b)}
function txCounted(a,b){const s0=S.settings.startDate;return txAll(a>s0?a:s0,b)}
const sign=x=>x.kind==='transfer'?0:x.kind==='in'?+x.amount:-x.amount;

function badge(a,size){

function accts(){const st=S.settings;if(!st)return[];if(st.accounts&&st.accounts.length)return st.accounts;return[{id:'main',name:'Main account',type:'bank',start:+st.startBalance||0}]}
const cashAccts=()=>accts().filter(a=>a.type!=='credit');
const creditAccts=()=>accts().filter(a=>a.type==='credit');
const defAcct=()=>(cashAccts()[0]||accts()[0]||{}).id;
const acctById=id=>accts().find(a=>a.id===id);
const acctOf=x=>acctById(x.acct)?x.acct:defAcct();
const acctName=id=>(acctById(id)||{name:'Account'}).name;
const acctColor=id=>{const a=acctById(id)||{};return a.color||brandColor(a.name)||(ACCT_TYPES[a.type]||ACCT_TYPES.bank).color};
const isCredit=id=>(acctById(id)||{}).type==='credit';
const startNet=()=>accts().reduce((s,a)=>s+(a.type==='credit'?-(+a.start||0):(+a.start||0)),0);
function acctBalances(d){
  const res={};for(const a of accts())res[a.id]=a.type==='credit'?-(+a.start||0):(+a.start||0);
  const s0=S.settings.startDate;if(d<s0)return res;
  const get=id=>acctById(id)?id:defAcct();
  for(const t of txCounted(s0,d)){if(t.kind==='transfer'){res[get(t.from)]-=+t.amount;res[get(t.to)]+=+t.amount}else res[acctOf(t)]+=sign(t)}
  for(const p of plannedCounted(s0,d))res[acctOf(p.it)]+=sign(p);
  for(const k in res)res[k]=r2(res[k]);return res;
}
function balanceEnd(d){const st=S.settings;let b=startNet();if(d<st.startDate)return null;for(const t of txCounted(st.startDate,d))b+=sign(t);for(const p of plannedCounted(st.startDate,d))b+=sign(p);return r2(b)}
function paydays(a,b){const set=new Set();for(const it of items())if(it.payday&&it.kind==='in')for(const d of occ(it,a,b))set.add(d);return [...set].sort()}
function periodFor(d){
  const back=paydays(addDays(d,-400),d),fwd=paydays(addDays(d,1),addDays(d,400));
  const p=pd(d),mStart=ds(new Date(p.getFullYear(),p.getMonth(),1)),mEnd=ds(new Date(p.getFullYear(),p.getMonth()+1,0));
  if(!back.length&&!fwd.length)return{start:mStart,end:mEnd,next:null,hasPay:false};
  const next=fwd[0]||null;
  const s0=S.settings&&S.settings.startDate;
  const start=back.length?back[back.length-1]:(s0&&s0<=d?s0:d);
  return{start,end:next?addDays(next,-1):mEnd,next,hasPay:true};
}
function stats(d){
  const P=periodFor(d),st=S.settings,s0=st.startDate;
  const es=s0>P.start?s0:P.start;
  const carried=es<=s0?startNet():balanceEnd(addDays(es,-1));
  const txs=txCounted(es,P.end),pl=plannedCounted(es,P.end);
  let inflow=0,spent=0,billsPaid=0,billsUp=0;const byCat={};const byType={bill:{paid:0,up:0},sub:{paid:0,up:0}};
  for(const t of txs){
    if(t.kind==='transfer')continue;
    if(t.adj){inflow+=sign(t);continue}
    if(t.kind==='in')inflow+=+t.amount;
    else{spent+=+t.amount;const k=catKey(t.cat);byCat[k]=(byCat[k]||0)+(+t.amount)}
  }
  for(const o of pl){if(o.kind==='in'){inflow+=o.amount;continue}const ty=byType[outType(o.it)];if(o.date<=d){billsPaid+=o.amount;ty.paid+=o.amount}else{billsUp+=o.amount;ty.up+=o.amount}}
  const available=r2(carried+inflow);
  const sv=st.savings||{},payIn=plannedAll(P.start,P.end).filter(o=>o.kind==='in'&&o.it.payday).reduce((s,o)=>s+o.amount,0);
  const saveTarget=r2(!sv.value?0:sv.mode==='percent'?Math.round(payIn*sv.value/100):+sv.value);
  const beforeSave=r2(available-spent-billsPaid-billsUp),left=r2(beforeSave-saveTarget);
  const saveSafe=r2(Math.max(0,Math.min(saveTarget,beforeSave))),saveRisk=r2(saveTarget-saveSafe);
  const total=diffDays(P.start,P.end)+1,daysLeft=Math.max(1,diffDays(d,P.end)+1);
  const pace=Math.min(1,Math.max(0,(diffDays(P.start,d)+1)/total));
  return{...P,es,carried:r2(carried),inflow:r2(inflow),spent:r2(spent),billsPaid:r2(billsPaid),billsUp:r2(billsUp),byCat,byType,saveTarget,saveSafe,saveRisk,payIn:r2(payIn),available,left,total,daysLeft,pace,txs,pl};
}
function nextOcc(it){return occ(it,today(),addDays(today(),800))[0]||null}
function repeatLabel(it){
  const r=it.repeat||'none';
  if(r==='none')return 'One-time · '+fmtShort(it.date);
  if(r==='weekly')return 'Every '+pd(it.date).toLocaleDateString('en-US',{weekday:'long'});
  if(r==='biweekly')return 'Every 2 weeks';
  if(r==='monthly')return (it.dom>=31?'Last day of every month':'Monthly on the '+ord(it.dom||pd(it.date).getDate()));
  if(r==='yearly')return 'Yearly on '+fmtShort(it.date);
  return '';
}

  // quick add

/* ---------- Paydays ---------- */
function daySel(attr,val){let o='';for(let d=1;d<=31;d++)o+=`<option value="${d}" ${+val===d?'selected':''}>${d===31?'Last day':ord(d)}</option>`;return `<select class="inp" ${attr}>${o}</select>`}
/* a monthly payday whose first date is the month before `from`, so earlier pay periods line up */
function monthlyPayday(dom,amount,from,name){const f=pd(from);const py=f.getMonth()===0?f.getFullYear()-1:f.getFullYear(),pm=(f.getMonth()+11)%12;
  return{id:newId(),name:name||'Salary',kind:'in',amount,repeat:'monthly',dom,date:ds(new Date(py,pm,Math.min(dom,dim(py,pm)))),payday:true}}
function firstOnOrAfter(dom,t){const d=pd(t);let y=d.getFullYear(),m=d.getMonth();let s=ds(new Date(y,m,Math.min(dom,dim(y,m))));if(s<t){m++;if(m>11){m=0;y++}s=ds(new Date(y,m,Math.min(dom,dim(y,m))))}return s}
const domOf=i=>i.dom||pd(i.date).getDate();
const activeMonthlyPaydays=()=>items().filter(i=>i.kind==='in'&&i.payday&&i.repeat==='monthly'&&!(i.until&&i.until<today()));
const openLook=new Set();let payDraft=null,payMode='fix',acctDraft=null,sbAcct=null,svMode=null,svVal='';
function savePaydays(){
  const t=today(),rows=payDraft.map(r=>({...r,amount:parseAmt(r.amount),dom:+r.dom}));
  if(rows.some(r=>!r.amount)){toast('Enter the amount for each payday');return false}
  if(new Set(rows.map(r=>r.dom)).size!==rows.length){toast('Two paydays are on the same day');return false}
  const orig=activeMonthlyPaydays();let arr=items();
  const same=(o,r)=>r&&domOf(o)===r.dom&&+o.amount===r.amount;
  for(const o of orig){
    const r=rows.find(x=>x.id===o.id);if(same(o,r))continue;
    if(payMode==='fix'||o.date>=t)arr=arr.filter(x=>x.id!==o.id);
    else o.until=addDays(t,-1);
  }
  for(const r of rows){
    const o=orig.find(x=>x.id===r.id);if(o&&same(o,r))continue;
    const n=monthlyPayday(r.dom,r.amount,S.settings.startDate,o&&o.name);
    if(payMode==='today')n.date=firstOnOrAfter(r.dom,t);
    arr.push(n);
  }
  S.plans.items=arr;savePlans();return true;
}

    ${(calY!==new Date().getFullYear()||calM!==new Date().getMonth())?'<button class="linkbtn" data-act="caltoday">Back to this month</button>':''}</div>
  <div class="card"><h2>This month</h2><div class="sumgrid num">
    <div><div class="v" style="color:var(--bad)">${money(mOut)}</div><div class="l">spent</div></div>
    <div><div class="v" style="color:var(--bill)">${money(mPlanOut)}</div><div class="l">bills &amp; planned</div></div>
    <div><div class="v" style="color:var(--in)">${money(mIn)}</div><div class="l">money in</div></div></div>
    <div class="small muted" style="margin-top:12px">Tap any day to log spending or plan money in or out.</div></div>`;
}

      const q=s=>b.querySelector(s);if(q('#tf-acct'))t.acct=q('#tf-acct').value;if(q('#tf-from'))t.from=q('#tf-from').value;if(q('#tf-to'))t.to=q('#tf-to').value};

    b.querySelector('#tf-save').onclick=()=>{

    ${rep!=='none'?`<label class="field"><span>Stop after (optional)</span><input id="pf-until" type="date" value="${esc(it.until||'')}"></label>`:''}
    ${it.kind==='in'?`<label class="check"><input type="checkbox" id="pf-pay" ${it.payday?'checked':''}><span><b>This is a payday</b><br><span class="muted small">Paydays start a new budget period, and your bars reset.</span></span></label>`:''}
    ${it.skips&&it.skips.length?`<div class="small muted">Skipped: ${it.skips.map(fmtShort).join(', ')} <button class="mini" id="pf-unskip">Undo skips</button></div>`:''}
    <button class="btn" id="pf-save">Save</button>${isNew?'':'<button class="btn danger" id="pf-del">Delete (all dates)</button>'}`);
    const b=$('#sheet-body');
    const keep=()=>{const ac=b.querySelector('#pf-acct');if(ac)it.acct=ac.value;it.name=b.querySelector('#pf-name').value;it.amount=b.querySelector('#pf-amt').value;it.date=b.querySelector('#pf-date').value;it.repeat=b.querySelector('#pf-rep').value;

/* ---------- Backup ---------- */
const IS_LOCAL=true;
function backupJSON(){return JSON.stringify({app:'my-finances',version:1,exported:new Date().toISOString(),settings:S.settings,plans:S.plans,months:S.months,logos:S.logos||{}})}
function markBackup(){try{localStorage.setItem('mf-last-backup',String(Date.now()))}catch(e){}}
function lastBackupText(){let t=null;try{t=+localStorage.getItem('mf-last-backup')}catch(e){}if(!t)return '<span style="color:var(--warn);font-weight:700">No backup yet.</span>';const d=Math.floor((Date.now()-t)/864e5);return `<span class="muted">Last backup: ${d===0?'today':d===1?'yesterday':d+' days ago'}</span>`}
function downloadBackup(){const blob=new Blob([backupJSON()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-finances-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);markBackup();toast('Backup downloaded');render(true)}
function importData(o){
  if(!o||typeof o!=='object'||!o.settings||!o.settings.startDate)throw new Error('bad');
  const old=Object.keys(S.months);
  S.settings=o.settings;S.plans={items:[],...(o.plans||{})};S.months={};for(const k in (o.months||{}))S.months[k]={tx:[],...o.months[k]};S.logos=o.logos||{};
  catDraft=payDraft=acctDraft=null;svMode=null;
  save('settings');save('plans');save('logos');for(const k in S.months)save('m-'+k);for(const k of old)if(!S.months[k])removeDoc('m-'+k);
}

    <label class="field"><span>Account</span>${acctSelect('sb-acct',sbAcct&&acctById(sbAcct)?sbAcct:defAcct())}</label>
    <div class="small" id="sb-now" style="margin:-2px 0 8px"></div>
    <div class="row2"><input class="inp" id="sb-real" inputmode="decimal" placeholder="Real amount"><button class="btn alt" id="sb-fix" style="margin:0">Fix balance</button></div></div>
  <div class="card"><h2>Savings target</h2>
    <div class="small muted" style="margin-bottom:10px">Money set aside every pay period. It comes off your free-to-spend so you don’t spend it by accident.</div>
    <div class="seg-toggle" id="sv-mode"><button data-m="amount" class="${svMode==='amount'?'on':''}">Fixed amount</button><button data-m="percent" class="${svMode==='percent'?'on':''}">% of pay</button></div>
    <div class="amount-wrap">${svMode==='amount'?`<span class="cur">${esc(cur())}</span>`:''}<input class="amount-in" id="sv-val" inputmode="decimal" placeholder="0" value="${esc(svVal)}">${svMode==='percent'?'<span class="cur">%</span>':''}</div>
    <div class="small" id="sv-prev" style="margin-top:8px"></div>
    <button class="btn" id="sv-save">Save savings target</button></div>
  <div class="card"><h2>Budgets per pay period</h2><div id="catrows">${catDraft.map((c,i)=>`<div class="catrow cc4"><input type="color" class="colorin" data-cc="${i}" value="${c.color||PALETTE[i%PALETTE.length]}" aria-label="Category color"><input class="inp" data-cn="${i}" value="${esc(c.name)}" placeholder="Category"><input class="inp" data-cb="${i}" inputmode="decimal" value="${c.budget?esc(c.budget):''}" placeholder="₱ budget"><button class="x" data-cx="${i}" aria-label="Remove">✕</button></div>`).join('')}</div>
    <button class="linkbtn" id="cat-add">+ Add category</button>
    <button class="btn" id="cat-save">Save budgets</button></div>
  <div class="card"><h2>Starting point</h2>
    <div class="row2"><label class="field"><span>Started tracking on</span><input id="sp-date" type="date" value="${esc(st.startDate)}"></label><label class="field"><span>Currency symbol</span><input id="sp-cur" value="${esc(st.currency||'₱')}" maxlength="4"></label></div>
    <div class="small muted">Entries before this date aren’t counted in your balances.</div>
    <button class="btn alt" id="sp-save">Save</button></div>
  <div class="card"><h2>Your data</h2>
    <div class="small muted">${IS_LOCAL?'Saved only on this phone. Download a backup now and then, and keep it somewhere safe like Google Drive.':'Saved to your account and private to you.'}</div>
    ${IS_LOCAL?`<div class="small" style="margin-top:6px">${lastBackupText()}</div><button class="btn" id="dt-file">Download backup file</button>`:''}
    <button class="btn alt" id="dt-copy">Copy backup</button><button class="btn alt" id="dt-restore">Restore from backup</button><button class="btn danger" id="dt-reset">Erase everything</button></div>`;
  const ab=el.querySelector('#acctrows');
  const redrawA=()=>{ab.innerHTML=acctRowsHTML(acctDraft,st.startDate);bindAcctRows(ab,acctDraft,st.startDate,redrawA)};redrawA();
  el.querySelector('#acct-add').onclick=()=>{acctDraft.push({id:newId(),name:'',type:'credit',start:''});redrawA();const n=ab.querySelectorAll('[data-an]');n[n.length-1].focus()};
  el.querySelector('#acct-save').onclick=()=>{const list=cleanAccts(acctDraft);if(!list.length){toast('Add at least one account');return}
    S.settings.accounts=list;S.settings.startBalance=startNet();acctDraft=null;saveSettings();blurAll();render(true);toast('Accounts saved')};
  const sbSel=el.querySelector('#sb-acct'),sbNow=el.querySelector('#sb-now');
  const showNow=()=>{sbAcct=sbSel.value;const b=acctBalances(t)[sbAcct],cr=isCredit(sbAcct);sbNow.innerHTML=cr?`Tracked as owed: <b class="num">${money(Math.max(0,-b))}</b>. Enter what you really owe.`:`Tracked balance: <b class="num">${money(b)}</b>`};
  sbSel.onchange=showNow;showNow();
  el.querySelector('#sb-fix').onclick=()=>{
    const v=el.querySelector('#sb-real').value;if(!String(v).trim()){toast('Enter the real amount');return}
    const id=sbSel.value,cr=isCredit(id),cur0=acctBalances(t)[id];
    let real=parseAmt(v)*(String(v).trim().startsWith('-')?-1:1);if(cr)real=-real;
    const diff=r2(real-cur0);if(!diff){toast('Already matches');return}
    addTx({id:newId(),date:t<st.startDate?st.startDate:t,acct:id,amount:Math.abs(diff),kind:diff>0?'in':'out',adj:true,note:'',ts:Date.now()});el.querySelector('#sb-real').value='';blurAll();render(true);toast(acctName(id)+' corrected');
  };
  el.querySelectorAll('[data-pd]').forEach(x=>x.onchange=()=>payDraft[+x.dataset.pd].dom=+x.value);
  el.querySelectorAll('[data-pa]').forEach(x=>x.oninput=()=>{payDraft[+x.dataset.pa].amount=x.value;const s=el.querySelector('#pay-pm');if(s)s.textContent='≈ '+money(Math.round(payDraft.reduce((a,r)=>a+parseAmt(r.amount),0)+otherPays.reduce((a,i)=>a+monthlyEq(i),0)))+' / month'});
  el.querySelectorAll('[data-px]').forEach(x=>x.onclick=()=>{payDraft.splice(+x.dataset.px,1);render(true)});
  el.querySelectorAll('input[name=paymode]').forEach(x=>x.onchange=()=>payMode=x.value);
  el.querySelector('#pay-add').onclick=()=>{const used=new Set(payDraft.map(r=>+r.dom));let d=[15,30,10,25,5,20,1].find(x=>!used.has(x))||1;payDraft.push({dom:d,amount:''});render(true)};
  el.querySelector('#pay-save').onclick=()=>{if(savePaydays()){payDraft=null;blurAll();render(true);toast('Paydays saved')}};
  el.querySelectorAll('[data-cn]').forEach(x=>x.oninput=()=>catDraft[+x.dataset.cn].name=x.value);
  el.querySelectorAll('[data-cb]').forEach(x=>x.oninput=()=>catDraft[+x.dataset.cb].budget=x.value);
  el.querySelectorAll('[data-cx]').forEach(x=>x.onclick=()=>{catDraft.splice(+x.dataset.cx,1);render(true)});
  const svPrev=()=>{const v=parseAmt(el.querySelector('#sv-val').value),p=el.querySelector('#sv-prev');const P=periodFor(t);
    const pay=plannedAll(P.start,P.end).filter(o=>o.kind==='in'&&o.it.payday).reduce((s,o)=>s+o.amount,0);
    p.innerHTML=!v?'<span class="muted">No savings target.</span>':svMode==='percent'?`This pay period: <b class="num">${money(Math.round(pay*v/100))}</b> <span class="muted">(${v}% of ${money(pay)} pay)</span>`:`<b class="num">${money(v)}</b> <span class="muted">every pay period</span>`};
  svPrev();el.querySelector('#sv-val').oninput=e=>{svVal=e.target.value;svPrev()};
  el.querySelectorAll('#sv-mode button').forEach(x=>x.onclick=()=>{svMode=x.dataset.m;svVal='';render(true)});
  el.querySelector('#sv-save').onclick=()=>{let v=parseAmt(el.querySelector('#sv-val').value);if(svMode==='percent'&&v>100){toast('Use a percentage up to 100');return}
    S.settings.savings=v?{mode:svMode,value:v}:null;svMode=null;saveSettings();blurAll();render(true);toast(v?'Savings target saved':'Savings target removed')};
  el.querySelectorAll('[data-cc]').forEach(x=>x.oninput=()=>catDraft[+x.dataset.cc].color=x.value);
  el.querySelector('#cat-add').onclick=()=>{catDraft.push({id:newId(),name:'',budget:''});render(true);const ins=el.querySelectorAll('[data-cn]');ins[ins.length-1]&&ins[ins.length-1].focus()};
  el.querySelector('#cat-save').onclick=()=>{S.settings.categories=catDraft.filter(c=>c.name.trim()).map((c,i)=>({id:c.id,name:c.name.trim(),budget:parseAmt(c.budget),color:c.color||PALETTE[catDraft.indexOf(c)%PALETTE.length]}));catDraft=null;saveSettings();blurAll();render(true);toast('Budgets saved')};
  el.querySelector('#sp-save').onclick=()=>{S.settings.startDate=el.querySelector('#sp-date').value||st.startDate;S.settings.currency=el.querySelector('#sp-cur').value.trim()||'₱';saveSettings();blurAll();render(true);toast('Saved')};
  el.querySelector('#dt-copy').onclick=async()=>{try{await navigator.clipboard.writeText(backupJSON());markBackup();toast('Backup copied')}catch(e){toast('Couldn’t copy on this device')}};
  el.querySelector('#dt-restore').onclick=openRestore;
  const df=el.querySelector('#dt-file');if(df)df.onclick=downloadBackup;
  const rs=el.querySelector('#dt-reset');rs.onclick=()=>{if(!armed(rs))return;
    const ids=['settings','plans','logos',...Object.keys(S.months).map(k=>'m-'+k)];
    S.settings=null;S.plans={items:[]};S.months={};S.logos={};catDraft=null;payDraft=null;acctDraft=null;ids.forEach(removeDoc);view='home';render(true);toast('Erased')};
}

/* ---------- global clicks ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('nav.tabs button');
  if(tab){view=tab.dataset.tab;if(view!=='setup'){catDraft=null;payDraft=null;acctDraft=null;svMode=null}closeSheet();blurAll();render(true);window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='close')closeSheet();
  else if(act==='day')openDay(a.dataset.date);
  else if(act==='calprev'){calM--;if(calM<0){calM=11;calY--}render(true)}
  else if(act==='calnext'){calM++;if(calM>11){calM=0;calY++}render(true)}
  else if(act==='caltoday'){calY=new Date().getFullYear();calM=new Date().getMonth();render(true)}
  else if(act==='newtx')openTxForm(null,a.dataset.date);
  else if(act==='edittx'){const t=findTx(a.dataset.id);if(t)openTxForm(t)}
  else if(act==='newplan')openPlanForm(null,a.dataset.date,a.dataset.type);
  else if(act==='editplan'){const it=items().find(x=>x.id===a.dataset.id);if(it)openPlanForm(it)}
  else if(act==='skip'){e.stopPropagation();const it=items().find(x=>x.id===a.dataset.id);if(it){it.skips=[...(it.skips||[]),a.dataset.date];savePlans();toast('Skipped '+fmtShort(a.dataset.date));render(true)}}
  else if(act==='restore')openRestore();
  else if(act==='backupnow')downloadBackup();
  else if(act==='acct')openAcct(a.dataset.id);
  else if(act==='paycard'){const b=acctBalances(today())[a.dataset.id];openTxForm(null,null,{kind:'transfer',from:defAcct(),to:a.dataset.id,amount:b<0?r2(-b):'',note:''})}
  else if(act==='alltx'){showAllTx=!showAllTx;render(true)}
});

/* ---------- start ---------- */
function applyDoc(id,data){
  data=clone(data||{});
  if(id==='settings')S.settings=data;
  else if(id==='plans')S.plans={items:[],...data};
  else if(id==='logos')S.logos=data;
  else if(id.startsWith('m-'))S.months[id.slice(2)]={tx:[],...data};
}
function removeLocal(id){if(id==='logos')S.logos={};else if(id==='settings')S.settings=null;else if(id==='plans')S.plans={items:[]};else if(id.startsWith('m-'))delete S.months[id.slice(2)]}
function localMode(msg){S.ready=true;banner(msg);render(true)}
function init(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){const o=JSON.parse(raw);S.settings=o.settings||null;S.plans={items:[],...(o.plans||{})};S.months=o.months||{};S.logos=o.logos||{}}}
  catch(e){banner('Your saved data couldn’t be read on this phone. If you have a backup, restore it in Setup.')}
  S.ready=true;render(true);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
</body>
</html>
